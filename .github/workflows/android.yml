name: Android APK

on:
  push:
    branches: [main]
    paths:
      - apps/android/**
      # The exercise pictures and spoken cues are packed into the APK.
      - apps/web/src/assets/**
      # FixturesTest reads the prepared states of the verify skill.
      - .claude/skills/verify-eisen/fixtures/**
      - .github/workflows/android.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repository
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true
      - name: Test
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Build signed APK
        working-directory: apps/android
        env:
          KEYSTORE_BASE64: ${{ secrets.EISEN_KEYSTORE_BASE64 }}
          EISEN_KEYSTORE_PASSWORD: ${{ secrets.EISEN_KEYSTORE_PASSWORD }}
          EISEN_VERSION_CODE: ${{ github.run_number }}
        run: |
          export EISEN_KEYSTORE="$RUNNER_TEMP/eisen-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$EISEN_KEYSTORE"
          ./gradlew :app:assembleRelease --console=plain
          rm "$EISEN_KEYSTORE"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/eisen.apk"
      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eisen-apk
          path: ${{ runner.temp }}/eisen.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # replace the APK on the rolling release
    steps:
      - name: Download APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eisen-apk
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          notes="Eisen for Android, build ${RUN_NUMBER} from ${COMMIT:0:7}. Download eisen.apk on your phone and open it to install or update."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest eisen.apk --clobber
            gh release edit android-latest --title "Eisen for Android (build ${RUN_NUMBER})" --notes "$notes"
          else
            gh release create android-latest eisen.apk --title "Eisen for Android (build ${RUN_NUMBER})" --notes "$notes" --target "$COMMIT"
          fi
